services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: doc_classifier_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doc_classifier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doc_classifier"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doc_network

  # -------------------------------------------------------------
  # Redis Task Queue & Rate Limiter Service
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: doc_classifier_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doc_network

  # -------------------------------------------------------------
  # FastAPI Backend REST API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_classifier_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Indian Financial Document Classification Engine"
      APP_ENV: "production"
      DEBUG: "false"
      API_V1_PREFIX: "/api/v1"
      SECRET_KEY: "b4a92e21b79f8c62d04f214e9127814b7324c4fcaea7d5f048dbe55b41fae019"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "doc_classifier"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/doc_classifier"
      SYNC_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/doc_classifier"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Points to local llama.cpp running on the host system
      LLAMA_CPP_URL: "http://host.docker.internal:8080/v1/chat/completions"
      LLAMA_MODEL_NAME: "Llama-3.2-3B-Instruct"
      LLM_REQUEST_TIMEOUT_SECONDS: "60.0"
      PADDLE_OCR_USE_GPU: "false"
      PADDLE_OCR_LANG: "en"
      UPLOAD_DIR: "/app/uploads"
      MAX_FILE_SIZE_BYTES: "104857600"
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://127.0.0.1:3000","http://127.0.0.1:8000","http://localhost:5173","http://127.0.0.1:5173"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1","0.0.0.0","backend"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - document_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - doc_network

  # -------------------------------------------------------------
  # ARQ Asynchronous Background Worker Service
  # -------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_classifier_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "doc_classifier"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/doc_classifier"
      SYNC_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/doc_classifier"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Points to local llama.cpp running on the host system
      LLAMA_CPP_URL: "http://host.docker.internal:8080/v1/chat/completions"
      LLAMA_MODEL_NAME: "Llama-3.2-3B-Instruct"
      LLM_REQUEST_TIMEOUT_SECONDS: "60.0"
      PADDLE_OCR_USE_GPU: "false"
      PADDLE_OCR_LANG: "en"
      UPLOAD_DIR: "/app/uploads"
      SECRET_KEY: "b4a92e21b79f8c62d04f214e9127814b7324c4fcaea7d5f048dbe55b41fae019"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - document_uploads:/app/uploads
    command: arq app.worker.WorkerSettings
    networks:
      - doc_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  document_uploads:
    driver: local

networks:
  doc_network:
    driver: bridge
