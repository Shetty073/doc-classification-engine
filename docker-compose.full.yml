# ==============================================================================
# FULL STACK DOCKER COMPOSE CONFIGURATION (docker-compose.full.yml)
# Runs ALL Services Containerized:
# 1. PostgreSQL (Database)
# 2. Redis (Task Queue & Rate Limiter)
# 3. llama.cpp Server (Configurable Local LLM Container)
# 4. FastAPI Backend (REST API Service, Scalable Replicas)
# 5. ARQ Worker (OCR & Inference Pipeline, Scalable Replicas)
# 6. React Frontend (Nginx Production Reverse Proxy)
#
# Usage:
#   docker compose -f docker-compose.full.yml up --build -d
#   docker compose -f docker-compose.full.yml --scale worker=4 up -d
# ==============================================================================

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: doc_classifier_postgres_full
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doc_classifier}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_full:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-doc_classifier}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doc_network_full

  # -------------------------------------------------------------
  # 2. Redis Task Queue Service
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: doc_classifier_redis_full
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_full:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doc_network_full

  # -------------------------------------------------------------
  # 3. llama.cpp Local LLM Inference Server (Configurable Attributes)
  # -------------------------------------------------------------
  llama:
    build:
      context: .
      dockerfile: Dockerfile.llama
    container_name: doc_classifier_llama_full
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    environment:
      # Model & Execution Attributes (Configurable via .env or CLI)
      MODEL_PATH: ${LLAMA_MODEL_PATH:-/models/Llama-3.2-3B-Instruct-Q4_K_M.gguf}
      CTX_SIZE: ${LLAMA_CTX_SIZE:-4096}
      N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-0}
      THREADS: ${LLAMA_THREADS:-4}
      BATCH_SIZE: ${LLAMA_BATCH_SIZE:-512}
      TEMPERATURE: ${LLAMA_TEMPERATURE:-0.05}
      PORT: "8080"
      HOST: "0.0.0.0"
      EXTRA_ARGS: ${LLAMA_EXTRA_ARGS:-}
    volumes:
      # Mount host directory containing GGUF model files
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - doc_network_full

  # -------------------------------------------------------------
  # 4. FastAPI REST Backend Service (Scalable Replicas)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llama:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: "Indian Financial Document Classification Engine"
      APP_ENV: "production"
      DEBUG: "false"
      API_V1_PREFIX: "/api/v1"
      SECRET_KEY: ${SECRET_KEY:-b4a92e21b79f8c62d04f214e9127814b7324c4fcaea7d5f048dbe55b41fae019}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doc_classifier}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doc_classifier}"
      SYNC_DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doc_classifier}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Points to the containerized llama service
      LLAMA_CPP_URL: "http://llama:8080/v1/chat/completions"
      LLAMA_MODEL_NAME: ${LLAMA_MODEL_NAME:-Llama-3.2-3B-Instruct}
      LLM_REQUEST_TIMEOUT_SECONDS: "60.0"
      PADDLE_OCR_USE_GPU: "false"
      PADDLE_OCR_LANG: "en"
      UPLOAD_DIR: "/app/uploads"
      MAX_FILE_SIZE_BYTES: "104857600"
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://127.0.0.1:3000","http://127.0.0.1:8000","http://localhost:5173","http://127.0.0.1:5173"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1","0.0.0.0","backend","frontend"]'
    volumes:
      - document_uploads_full:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - doc_network_full

  # -------------------------------------------------------------
  # 5. ARQ Background Worker Service (Configurable Scaling)
  # -------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llama:
        condition: service_started
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doc_classifier}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doc_classifier}"
      SYNC_DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doc_classifier}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Points to the containerized llama service
      LLAMA_CPP_URL: "http://llama:8080/v1/chat/completions"
      LLAMA_MODEL_NAME: ${LLAMA_MODEL_NAME:-Llama-3.2-3B-Instruct}
      LLM_REQUEST_TIMEOUT_SECONDS: "60.0"
      PADDLE_OCR_USE_GPU: "false"
      PADDLE_OCR_LANG: "en"
      UPLOAD_DIR: "/app/uploads"
      SECRET_KEY: ${SECRET_KEY:-b4a92e21b79f8c62d04f214e9127814b7324c4fcaea7d5f048dbe55b41fae019}
    volumes:
      - document_uploads_full:/app/uploads
    command: arq app.worker.WorkerSettings
    networks:
      - doc_network_full

  # -------------------------------------------------------------
  # 6. React (Vite) Demo Frontend Service (Nginx Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc_classifier_frontend_full
    restart: unless-stopped
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - doc_network_full

volumes:
  postgres_data_full:
    driver: local
  redis_data_full:
    driver: local
  document_uploads_full:
    driver: local

networks:
  doc_network_full:
    driver: bridge
